[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gitrep"
version = "0.1.0"
description = "Multi-repo status & mass-fetch manager"
requires-python = ">=3.10"
authors = [{ name = "Rich Fiorella" }]
dependencies = [
    "rich>=13",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.10",
    "pytest>=7",
    "pytest-cov>=5",
    "pytest-timeout>=2",
    "ruff>=0.15",
]

[project.scripts]
gitrep = "gitrep.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
timeout = 60

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "C4", "PIE", "RET"]

[tool.mypy]
files = ["src"]
strict = true
